<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OwnHands · System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-bg:      #f8fafc;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-accent:  #eb6c36;
      --color-link:    #2563eb;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame {
      max-width: 1040px;
      width: 100%;
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 2rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .lead {
      font-size: 0.95rem;
      color: var(--color-muted);
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    .diagram-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--color-rule);
      border-radius: 6px;
      background: #ffffff;
    }

    svg {
      width: 100%;
      min-width: 920px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>OwnHands Thin Harness Architecture</h1>
    <p class="lead">
      상단: 의도 선언에서 사양·에이전트 실행 및 증거 수집으로 이어지는 순방향 실행 흐름(좌→우).<br>
      하단: 독립 서브에이전트의 1:1 대조 보고서와 인간 최종 승인 관문으로 이어지는 피드백 검증 루프(우→좌).
    </p>

    <div class="diagram-wrap">
      <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ownhands-arch-title ownhands-arch-desc">
        <title id="ownhands-arch-title">OwnHands Thin Harness Architecture</title>
        <desc id="ownhands-arch-desc">System architecture diagram showing forward execution flow left-to-right on the top track and verification approval loop right-to-left on the bottom track.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
          </marker>
        </defs>

        <!-- Clean Paper Background -->
        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- ZONE 1: Human Boundary (x=24, y=36, w=200, h=396) -->
        <rect x="24" y="36" width="200" height="396" rx="8"
              fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.14)" stroke-width="0.8"/>
        <rect x="36" y="42" width="176" height="14" rx="2" fill="#ffffff"/>
        <text x="124" y="52" fill="rgba(15,23,42,0.60)" font-size="8.5" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ZONE 01 · HUMAN BOUNDARY</text>

        <!-- ZONE 2: Platform & Harness (x=244, y=36, w=484, h=396) -->
        <rect x="244" y="36" width="484" height="396" rx="8"
              fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.14)" stroke-width="0.8"/>
        <rect x="394" y="42" width="184" height="14" rx="2" fill="#ffffff"/>
        <text x="486" y="52" fill="rgba(15,23,42,0.60)" font-size="8.5" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ZONE 02 · PLATFORM &amp; HARNESS</text>

        <!-- ZONE 3: Independent Verifier (x=748, y=36, w=228, h=396) -->
        <rect x="748" y="36" width="228" height="396" rx="8"
              fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.14)" stroke-width="0.8"/>
        <rect x="764" y="42" width="196" height="14" rx="2" fill="#ffffff"/>
        <text x="862" y="52" fill="rgba(15,23,42,0.60)" font-size="8.5" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ZONE 03 · INDEPENDENT VERIFIER</text>

        <!-- ================= CONNECTORS (Drawn BEFORE Nodes) ================= -->

        <!-- TOP TRACK 1: Human Intent -> Spec & Plan (Left-to-Right) -->
        <line x1="208" y1="132" x2="260" y2="132" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="214" y="112" width="40" height="14" rx="2" fill="#ffffff"/>
        <text x="234" y="122" fill="#2563eb" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INTENT</text>

        <!-- TOP TRACK 2: Spec & Plan -> Codex CLI (Left-to-Right) -->
        <line x1="476" y1="132" x2="508" y2="132" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
        <rect x="478" y="112" width="30" height="14" rx="2" fill="#ffffff"/>
        <text x="492" y="122" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN</text>

        <!-- TOP TRACK 3: Codex CLI -> Fresh Evidence (Left-to-Right) -->
        <line x1="712" y1="132" x2="764" y2="132" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
        <rect x="722" y="112" width="34" height="14" rx="2" fill="#ffffff"/>
        <text x="738" y="122" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOGS</text>

        <!-- TRANSITION 4: Fresh Evidence -> Verifier Subagent (Vertical Down in Zone 3) -->
        <line x1="862" y1="176" x2="862" y2="284" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
        <rect x="832" y="222" width="60" height="14" rx="2" fill="#ffffff"/>
        <text x="862" y="232" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVIDENCE</text>

        <!-- CRITERIA FEED: Spec & Plan -> Verifier Subagent (Orthogonal dashed baseline) -->
        <path d="M 368,176 V 232 Q 368,240 376,240 H 740 Q 748,240 748,248 V 328 Q 748,332 756,332 H 764"
              fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <rect x="520" y="232" width="92" height="14" rx="2" fill="#ffffff"/>
        <text x="566" y="242" fill="#2563eb" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRITERIA 1:1 FEED</text>

        <!-- BOTTOM TRACK 5: Verifier Subagent -> Human Gate (Right-to-Left Across Corridor) -->
        <line x1="764" y1="344" x2="208" y2="344" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <rect x="424" y="336" width="144" height="16" rx="2" fill="#ffffff"/>
        <text x="496" y="348" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.10em">05 VERIFICATION REPORT (1:1 대조)</text>

        <!-- FINAL MERGE 6: Human Gate -> Main Merge (Exit Downward) -->
        <line x1="124" y1="376" x2="124" y2="416" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <rect x="134" y="390" width="76" height="14" rx="2" fill="#ffffff"/>
        <text x="172" y="400" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAIN MERGE</text>

        <!-- ================= NODE BOXES ================= -->

        <!-- Node 1: Human Intent (x=40, y=88, w=168, h=88) -->
        <rect x="40" y="88" width="168" height="88" rx="6" fill="#ffffff"/>
        <rect x="40" y="88" width="168" height="88" rx="6" fill="rgba(15,23,42,0.02)" stroke="#0f172a" stroke-width="1"/>
        <rect x="48" y="94" width="48" height="14" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="72" y="104" fill="#0f172a" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPERATOR</text>
        <text x="124" y="126" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">작업 의도 선언</text>
        <text x="124" y="145" fill="#2563eb" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">intent.md · Non-goals</text>
        <text x="124" y="162" fill="#475569" font-size="12" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">Why before How 고정</text>

        <!-- Node 2: Spec & Plan (x=260, y=88, w=216, h=88) -->
        <rect x="260" y="88" width="216" height="88" rx="6" fill="#ffffff"/>
        <rect x="260" y="88" width="216" height="88" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="268" y="94" width="50" height="14" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="293" y="104" fill="#0f172a" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BASELINE</text>
        <text x="368" y="126" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">사양 및 실행 계획</text>
        <text x="368" y="145" fill="#2563eb" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">spec.md · plan.md</text>
        <text x="368" y="162" fill="#475569" font-size="12" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">사전 인수 기준 명세화</text>

        <!-- Node 3: Codex CLI (x=508, y=88, w=204, h=88) -->
        <rect x="508" y="88" width="204" height="88" rx="6" fill="#ffffff"/>
        <rect x="508" y="88" width="204" height="88" rx="6" fill="rgba(37,99,235,0.03)" stroke="#0f172a" stroke-width="1"/>
        <rect x="516" y="94" width="46" height="14" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="539" y="104" fill="#0f172a" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
        <text x="610" y="126" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">Codex CLI 실행</text>
        <text x="610" y="145" fill="#2563eb" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">codex exec · git branch</text>
        <text x="610" y="162" fill="#475569" font-size="12" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">단위 구현 및 테스트</text>

        <!-- Node 4: Fresh Evidence (x=764, y=88, w=196, h=88) -->
        <rect x="764" y="88" width="196" height="88" rx="6" fill="#ffffff"/>
        <rect x="764" y="88" width="196" height="88" rx="6" fill="rgba(15,23,42,0.04)" stroke="#475569" stroke-width="1"/>
        <rect x="772" y="94" width="48" height="14" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="796" y="104" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBSERVE</text>
        <text x="862" y="126" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">실제 관측 증거</text>
        <text x="862" y="145" fill="#2563eb" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">Fresh Evidence Logs</text>
        <text x="862" y="162" fill="#475569" font-size="12" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">터미널 로그 · Git Diff</text>

        <!-- Node 5: Verifier Subagent (FOCAL ACCENT 1) (x=764, y=288, w=196, h=88) -->
        <rect x="764" y="288" width="196" height="88" rx="6" fill="#ffffff"/>
        <rect x="764" y="288" width="196" height="88" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.5"/>
        <rect x="772" y="294" width="50" height="14" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
        <text x="797" y="304" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFIER</text>
        <text x="862" y="326" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">독립 검증 서브에이전트</text>
        <text x="862" y="345" fill="#eb6c36" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">spec.md ↔ evidence 1:1</text>
        <text x="862" y="362" fill="#475569" font-size="12" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">인수 기준 대조 &amp; 사각지대</text>

        <!-- Node 6: Human Gate (FOCAL ACCENT 2) (x=40, y=288, w=168, h=88) -->
        <rect x="40" y="288" width="168" height="88" rx="6" fill="#ffffff"/>
        <rect x="40" y="288" width="168" height="88" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.5"/>
        <rect x="48" y="294" width="38" height="14" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
        <text x="67" y="304" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="124" y="326" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">인간 승인 관문</text>
        <text x="124" y="345" fill="#eb6c36" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">Human Gate Decision</text>
        <text x="124" y="362" fill="#475569" font-size="12" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">검증 보고서 확인 후 머지</text>

        <!-- ================= LEGEND STRIP (Bottom) ================= -->
        <line x1="24" y1="452" x2="976" y2="452" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
        <text x="24" y="474" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="100" y="466" width="10" height="10" rx="2" fill="rgba(235,108,54,0.15)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="118" y="475" fill="#475569" font-size="9" font-family="'Geist Mono', 'Noto Sans KR', sans-serif">Focal Gate / Verifier (핵심 검증·승인점)</text>

        <line x1="390" y1="471" x2="418" y2="471" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="426" y="475" fill="#475569" font-size="9" font-family="'Geist Mono', 'Noto Sans KR', sans-serif">Forward Execution (상단: 순방향 실행 흐름 좌→우)</text>

        <line x1="720" y1="471" x2="748" y2="471" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <text x="756" y="475" fill="#475569" font-size="9" font-family="'Geist Mono', 'Noto Sans KR', sans-serif">Feedback Loop (하단: 검증·승인 루프 우→좌)</text>
      </svg>
    </div>
  </div>
</body>
</html>
