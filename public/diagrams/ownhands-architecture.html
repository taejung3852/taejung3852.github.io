<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OwnHands · System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-bg:      #f8fafc;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-accent:  #eb6c36;
      --color-link:    #2563eb;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame {
      max-width: 1020px;
      width: 100%;
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 2rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .lead {
      font-size: 0.95rem;
      color: var(--color-muted);
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    .diagram-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--color-rule);
      border-radius: 6px;
      background: #ffffff;
    }

    svg {
      width: 100%;
      min-width: 880px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>OwnHands Thin Harness Architecture</h1>
    <p class="lead">
      작업 의도 선언(Human)에서 마크다운 규격(Harness)과 Codex 실행을 거쳐, 독립 서브에이전트(Verifier)의 증거 대조 후 최종 승인(Human Gate)으로 이어지는 3-Tier 검증 구조.
    </p>

    <div class="diagram-wrap">
      <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ownhands-arch-title ownhands-arch-desc">
        <title id="ownhands-arch-title">OwnHands Thin Harness Architecture</title>
        <desc id="ownhands-arch-desc">System architecture diagram showing developer intent handoff through Markdown artifacts to Codex execution, fresh evidence capture, and independent subagent verification leading to human gate approval.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
          </marker>
        </defs>

        <!-- Clean Paper Background -->
        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- ZONE 1: Human Responsibility (x=36, y=36, w=276, h=356) -->
        <rect x="36" y="36" width="276" height="356" rx="8"
              fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
        <rect x="80" y="40" width="188" height="12" rx="2" fill="#ffffff"/>
        <text x="174" y="49" fill="rgba(15,23,42,0.55)" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ZONE 01 · HUMAN BOUNDARY</text>

        <!-- ZONE 2: Execution Harness (x=340, y=36, w=280, h=356) -->
        <rect x="340" y="36" width="280" height="356" rx="8"
              fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
        <rect x="388" y="40" width="184" height="12" rx="2" fill="#ffffff"/>
        <text x="480" y="49" fill="rgba(15,23,42,0.55)" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ZONE 02 · PLATFORM & HARNESS</text>

        <!-- ZONE 3: Independent Verification (x=648, y=36, w=276, h=356) -->
        <rect x="648" y="36" width="276" height="356" rx="8"
              fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
        <rect x="688" y="40" width="196" height="12" rx="2" fill="#ffffff"/>
        <text x="786" y="49" fill="rgba(15,23,42,0.55)" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ZONE 03 · INDEPENDENT VERIFIER</text>

        <!-- ================= CONNECTORS (Drawn BEFORE Nodes) ================= -->

        <!-- 1. Human Intent -> Spec & Plan (Straight line) -->
        <line x1="272" y1="120" x2="372" y2="120" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="296" y="102" width="52" height="12" rx="2" fill="#ffffff"/>
        <text x="322" y="111" fill="#2563eb" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01 INTENT</text>

        <!-- 2. Spec & Plan -> Codex CLI (Vertical line) -->
        <line x1="480" y1="156" x2="480" y2="244" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="490" y="194" width="56" height="12" rx="2" fill="#ffffff"/>
        <text x="518" y="203" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02 HANDOFF</text>

        <!-- 3. Codex CLI -> Fresh Evidence (Orthogonal elbow via mid-x=632) -->
        <path d="M 580,272 H 624 Q 632,272 632,264 V 128 Q 632,120 640,120 H 680"
              fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="608" y="184" width="48" height="12" rx="2" fill="#ffffff"/>
        <text x="632" y="193" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03 LOGS</text>

        <!-- 4. Fresh Evidence -> Verifier Subagent (Vertical line) -->
        <line x1="786" y1="156" x2="786" y2="244" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="796" y="194" width="60" height="12" rx="2" fill="#ffffff"/>
        <text x="826" y="203" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04 EVIDENCE</text>

        <!-- 5. Spec & Plan -> Verifier Subagent (Dashed criteria feed, offset mid-x=644) -->
        <path d="M 580,104 H 636 Q 644,104 644,112 V 280 Q 644,288 652,288 H 680"
              fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <rect x="612" y="76" width="64" height="12" rx="2" fill="#ffffff"/>
        <text x="644" y="85" fill="#2563eb" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRITERIA 1:1</text>

        <!-- 6. Verifier Subagent -> Human Gate (Focal Feedback Loop to Bottom Route) -->
        <path d="M 680,312 H 304 Q 296,312 296,304 V 292 Q 296,284 288,284 H 272"
              fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="424" y="296" width="116" height="12" rx="2" fill="#ffffff"/>
        <text x="482" y="305" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">05 VERIFICATION REPORT</text>

        <!-- 7. Human Gate -> Production Merge (Bottom exit) -->
        <path d="M 170,320 V 356"
              fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="180" y="332" width="68" height="12" rx="2" fill="#ffffff"/>
        <text x="214" y="341" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">06 MAIN MERGE</text>

        <!-- ================= NODE BOXES ================= -->

        <!-- Node 1: Human Intent (x=68, y=84, w=204, h=72) -->
        <rect x="68" y="84" width="204" height="72" rx="6" fill="#ffffff"/>
        <rect x="68" y="84" width="204" height="72" rx="6" fill="rgba(15,23,42,0.02)" stroke="#0f172a" stroke-width="1"/>
        <rect x="76" y="90" width="44" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="98" y="99" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPERATOR</text>
        <text x="170" y="118" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">작업 의도 선언</text>
        <text x="170" y="132" fill="#2563eb" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">intent.md · Non-goals</text>
        <text x="170" y="146" fill="#475569" font-size="8.5" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">Why before How · 비목표 고정</text>

        <!-- Node 2: Spec & Plan (x=372, y=84, w=208, h=72) -->
        <rect x="372" y="84" width="208" height="72" rx="6" fill="#ffffff"/>
        <rect x="372" y="84" width="208" height="72" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="380" y="90" width="46" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="403" y="99" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BASELINE</text>
        <text x="476" y="118" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">사양 및 실행 계획</text>
        <text x="476" y="132" fill="#2563eb" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">spec.md · plan.md</text>
        <text x="476" y="146" fill="#475569" font-size="8.5" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">사전 인수 기준 & 단위 커맨드</text>

        <!-- Node 3: Codex CLI Execution (x=372, y=244, w=208, h=76) -->
        <rect x="372" y="244" width="208" height="76" rx="6" fill="#ffffff"/>
        <rect x="372" y="244" width="208" height="76" rx="6" fill="rgba(37,99,235,0.03)" stroke="#0f172a" stroke-width="1"/>
        <rect x="380" y="250" width="44" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="402" y="259" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
        <text x="476" y="278" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">Codex CLI 실행</text>
        <text x="476" y="293" fill="#2563eb" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">codex exec · git branch</text>
        <text x="476" y="307" fill="#475569" font-size="8.5" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">단위 마일스톤 구현 & 테스트</text>

        <!-- Node 4: Fresh Evidence (x=680, y=84, w=212, h=72) -->
        <rect x="680" y="84" width="212" height="72" rx="6" fill="#ffffff"/>
        <rect x="680" y="84" width="212" height="72" rx="6" fill="rgba(15,23,42,0.04)" stroke="#475569" stroke-width="1"/>
        <rect x="688" y="90" width="44" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="710" y="99" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBSERVE</text>
        <text x="786" y="118" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">실제 관측 증거</text>
        <text x="786" y="132" fill="#2563eb" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">Fresh Evidence Logs</text>
        <text x="786" y="146" fill="#475569" font-size="8.5" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">터미널 실행 로그 · Git Diff · Hash</text>

        <!-- Node 5: Verifier Subagent (FOCAL ACCENT 1) (x=680, y=244, w=212, h=76) -->
        <rect x="680" y="244" width="212" height="76" rx="6" fill="#ffffff"/>
        <rect x="680" y="244" width="212" height="76" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.4"/>
        <rect x="688" y="250" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
        <text x="712" y="259" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFIER</text>
        <text x="786" y="278" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">독립 검증 서브에이전트</text>
        <text x="786" y="293" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">spec.md ↔ evidence 1:1 대조</text>
        <text x="786" y="307" fill="#475569" font-size="8.5" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">인수 기준 충족 입증 + 사각지대 보고</text>

        <!-- Node 6: Human Gate (FOCAL ACCENT 2) (x=68, y=248, w=204, h=72) -->
        <rect x="68" y="248" width="204" height="72" rx="6" fill="#ffffff"/>
        <rect x="68" y="248" width="204" height="72" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.4"/>
        <rect x="76" y="254" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
        <text x="94" y="263" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="170" y="282" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">인간 승인 관문</text>
        <text x="170" y="297" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">Human Gate Decision</text>
        <text x="170" y="310" fill="#475569" font-size="8.5" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">증거 보고서 확인 후 최종 배포 머지</text>

        <!-- ================= LEGEND STRIP (Bottom) ================= -->
        <line x1="36" y1="428" x2="924" y2="428" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
        <text x="36" y="446" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="120" y="440" width="10" height="10" rx="2" fill="rgba(235,108,54,0.15)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="136" y="448" fill="#475569" font-size="8.5" font-family="'Geist Mono', 'Noto Sans KR', sans-serif">Focal Gate / Verifier (핵심 검증·승인점)</text>

        <line x1="380" y1="445" x2="408" y2="445" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="416" y="448" fill="#475569" font-size="8.5" font-family="'Geist Mono', 'Noto Sans KR', sans-serif">Execution & Evidence Flow (실행 및 데이터 흐름)</text>

        <line x1="680" y1="445" x2="708" y2="445" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <text x="716" y="448" fill="#475569" font-size="8.5" font-family="'Geist Mono', 'Noto Sans KR', sans-serif">Criteria Baseline Feed (사전 인수 기준 대조선)</text>
      </svg>
    </div>
  </div>
</body>
</html>
