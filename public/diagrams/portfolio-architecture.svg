  <rect x="238" y="186" width="44" height="12" rx="2" fill="#f7f6f3"/>
  <text x="260" y="195" fill="#56534a" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.06em">IMPORT</text>

