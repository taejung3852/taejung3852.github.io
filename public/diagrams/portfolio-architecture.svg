  <text x="720" y="260" fill="#16150f" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">prepare-routes.mjs</text>
  <text x="720" y="276" fill="#aa5119" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">dist/projects/* entries</text>
  <text x="720" y="292" fill="#56534a" font-size="8" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">정적 라우트 및 404 자동 매핑</text>

  <!-- LEGEND (bottom horizontal strip) -->
  <line x1="40" y1="376" x2="840" y2="376" stroke="rgba(22, 21, 15, 0.12)" stroke-width="0.8"/>
  <text x="40" y="402" fill="#56534a" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">LEGEND</text>

  <!-- Legend Item 1: Internal Component Flow -->
  <line x1="120" y1="398" x2="148" y2="398" stroke="#56534a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="156" y="402" fill="#56534a" font-size="8" font-family="'Geist', 'Noto Sans KR', sans-serif">데이터 주입 및 렌더링</text>

  <!-- Legend Item 2: Build Pipeline -->
  <line x1="280" y1="398" x2="308" y2="398" stroke="#aa5119" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="316" y="402" fill="#aa5119" font-size="8" font-family="'Geist', 'Noto Sans KR', sans-serif" font-weight="600">빌드 및 라우트 생성</text>

  <!-- Legend Item 3: Public Asset Linkage -->
  <line x1="448" y1="398" x2="476" y2="398" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="484" y="402" fill="#2e5aa8" font-size="8" font-family="'Geist', 'Noto Sans KR', sans-serif">이력서 정적 다운로드 링크</text>

  <!-- Legend Item 4: Focal Step -->
  <rect x="632" y="392" width="12" height="12" rx="2" fill="rgba(170, 81, 25, 0.12)" stroke="#aa5119" stroke-width="0.8"/>
  <text x="652" y="402" fill="#16150f" font-size="8" font-family="'Geist', 'Noto Sans KR', sans-serif">핵심 라우트 패키징 (Focal)</text>
