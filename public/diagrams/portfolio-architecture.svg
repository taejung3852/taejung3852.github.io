  <rect x="64" y="92" width="28" height="12" rx="2" fill="transparent" stroke="rgba(22, 21, 15, 0.40)" stroke-width="0.8"/>
  <text x="78" y="101" fill="rgba(22, 21, 15, 0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSOT</text>
  <text x="136" y="120" fill="#16150f" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">portfolio.ts</text>
  <text x="136" y="136" fill="#56534a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Single Source of Truth</text>
