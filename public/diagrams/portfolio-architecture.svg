  <text x="420" y="276" fill="#56534a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ProfileCard · ProjectStudy · GSAP</text>
  <text x="420" y="292" fill="#56534a" font-size="8" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">인터랙션 및 테마 토글 제어</text>

