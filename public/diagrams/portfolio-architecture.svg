  <rect x="304" y="224" width="232" height="80" rx="6" fill="#f7f6f3"/>
  <rect x="304" y="224" width="232" height="80" rx="6" fill="#ffffff" stroke="#16150f" stroke-width="1"/>
  <rect x="312" y="232" width="28" height="12" rx="2" fill="transparent" stroke="rgba(22, 21, 15, 0.40)" stroke-width="0.8"/>
  <text x="326" y="241" fill="rgba(22, 21, 15, 0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
