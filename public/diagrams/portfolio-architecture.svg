<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="portfolio-arch-title portfolio-arch-desc">
  <title id="portfolio-arch-title">웹 포트폴리오 아키텍처 및 정적 빌드 파이프라인</title>
  <desc id="portfolio-arch-desc">단일 진실 공급원인 portfolio.ts에서 데이터를 읽어 Astro와 React로 렌더링하고 prepare-routes 스크립트를 통해 dist 정적 디렉토리로 패키징하는 아키텍처 다이어그램</desc>
  
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#56534a"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
