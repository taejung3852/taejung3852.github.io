  <text x="122" y="53" fill="#56534a" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">DATA SOURCE (content/)</text>

  <!-- Zone 2: Rendering Layer -->
  <rect x="280" y="48" width="280" height="296" rx="8" fill="rgba(22, 21, 15, 0.02)" stroke="rgba(22, 21, 15, 0.12)" stroke-width="0.8"/>
  <rect x="296" y="42" width="156" height="14" rx="2" fill="#f7f6f3"/>
  <text x="374" y="53" fill="#56534a" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">RENDERING ENGINE (src/)</text>

  <!-- Zone 3: Packaging & Output -->
  <rect x="600" y="48" width="240" height="296" rx="8" fill="rgba(22, 21, 15, 0.02)" stroke="rgba(22, 21, 15, 0.12)" stroke-width="0.8"/>
